<svg id="svg-logo-3" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
    <defs>
        <linearGradient id="l3-side1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fb7185"/>
            <stop offset="100%" stop-color="#e11d48"/>
        </linearGradient>
        <linearGradient id="l3-side2" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#f43f5e"/>
            <stop offset="100%" stop-color="#881337"/>
        </linearGradient>
        <linearGradient id="l3-side3" x1="100%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#fb923c"/>
            <stop offset="100%" stop-color="#f43f5e"/>
        </linearGradient>
        <filter id="logo-drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#f43f5e" flood-opacity="0.3"/>
        </filter>
    </defs>

    <!-- Interlocked Isometric Cube / Hex Lattice Bridging LAN devices -->
    <g transform="translate(100, 100)" filter="url(#logo-drop-shadow)">
        <!-- Top Facet Ring -->
        <path d="M 0 -65 L 55 -32 L 55 0 L 0 -32 Z" fill="url(#l3-side1)"/>
        <path d="M 0 -65 L -55 -32 L -55 0 L 0 -32 Z" fill="url(#l3-side3)"/>

        <!-- Bottom Right Facet -->
        <path d="M 55 0 L 55 65 L 0 32 L 0 -32 Z" fill="url(#l3-side2)" opacity="0.9"/>
        <path d="M 0 32 L 0 97 L -55 65 L -55 0 Z" fill="url(#l3-side1)"/>

        <!-- Bottom Left Linking Loop Arc -->
        <path d="M -55 -32 L -55 32 L 0 65 L 0 32 Z" fill="url(#l3-side3)" opacity="0.8"/>

        <!-- Glowing Bridge Node Ports -->
        <circle cx="0" cy="-32" r="7" fill="#ffffff"/>
        <circle cx="0" cy="32" r="7" fill="#ffffff"/>
        <circle cx="0" cy="0" r="4" fill="#fb7185"/>
    </g>
</svg>
